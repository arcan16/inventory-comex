server.port = 8081
spring.application.name=Inventories

spring.datasource.url = ${URL_DB_INVENTORIES_COMEX}
spring.datasource.username = ${USER_DB_INVENTORIES_COMEX}
spring.datasource.password = ${PASSWORD_DB_INVENTORIES_COMEX}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql = true

server.error.include-stacktrace=never

# Health check publico para que la app movil valide la IP/puerto configurados antes de iniciar sesion
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Token de seguridad
spring.secret.key = ${JWT_SECRET_KEY_INVENTORIES_COMEX}

# Time Expiration
spring.time.expiration = ${JWT_EXPIRATION_TIME_INVENTORIES_COMEX}

# Administrador inicial (se crea solo si la tabla de usuarios esta vacia)
app.admin.username = ${ADMIN_USERNAME_INVENTORIES_COMEX}
app.admin.password = ${ADMIN_PASSWORD_INVENTORIES_COMEX}
app.admin.email = ${ADMIN_EMAIL_INVENTORIES_COMEX}